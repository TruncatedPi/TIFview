name: Windows checks and portable build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Test channels, layers, pixel edits, TIFF saves and navigation
        run: python -m pytest -q --junitxml=build/test-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-python-${{ matrix.python }}
          path: build/test-results.xml
          if-no-files-found: ignore

  portable:
    name: Build and check Windows executable
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build executable, check pixels and edits, verify TIFF save, create ZIP
        run: python -m tools.build_windows
      - uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Save executable check
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: executable-check
          path: build/package-check.json
          if-no-files-found: ignore

  release:
    name: Publish checked Windows download
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: windows-portable
          path: release
      - name: Publish prototype release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag --title "TIFview $GITHUB_REF_NAME (prototype)"
          --notes-file docs/release-notes.md --latest
